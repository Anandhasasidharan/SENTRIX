{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-list-timeline"></i> Session Timeline</h2>
        <p class="text-muted">Session: <code>{{ session_id }}</code> &middot; {{ total }} events</p>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-clock-history"></i> Event Log</span>
        <span class="badge bg-secondary">{{ total }} events</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover mb-0" id="timeline-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Agent</th>
                        <th>Role</th>
                        <th>Provenance</th>
                        <th>Verdict</th>
                        <th>Tool</th>
                        <th>Blocked By</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    {% if events_json %}
                    <script>
                        const events = {{ events_json|safe }};
                        const table = document.getElementById('timeline-table').querySelector('tbody');
                        events.forEach(e => {
                            const row = table.insertRow();
                            const ts = new Date().toLocaleTimeString();
                            row.insertCell().textContent = ts;
                            row.insertCell().textContent = e.agent;
                            row.insertCell().textContent = e.role;
                            row.insertCell().textContent = e.provenance;
                            const vcell = row.insertCell();
                            if (e.verdict === 'allowed') { vcell.innerHTML = '<span class="badge badge-allowed">ALLOW</span>'; }
                            else if (e.verdict === 'blocked') { vcell.innerHTML = '<span class="badge badge-blocked">BLOCK</span>'; }
                            else if (e.verdict === 'flagged') { vcell.innerHTML = '<span class="badge badge-flagged">FLAG</span>'; }
                            else { vcell.innerHTML = '<span class="badge bg-secondary">INFO</span>'; }
                            row.insertCell().textContent = e.tool || '';
                            const bcell = row.insertCell();
                            bcell.textContent = e.blocked_by || '';
                            if (e.blocked_by) { bcell.innerHTML = '<span class="badge bg-danger">' + e.blocked_by + '</span>'; }
                            row.insertCell().textContent = e.score !== null ? e.score.toFixed(2) : '';
                        });
                    </script>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header"><i class="bi bi-file-text"></i> Raw Timeline</div>
    <div class="card-body">
        <pre style="max-height: 400px;">{{ timeline_text }}</pre>
    </div>
</div>
{% endblock %}
